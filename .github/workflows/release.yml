# Builds the installable add-on zip and attaches it to a GitHub Release.
#
# Triggered by pushing a version tag:
#     git tag v2.3.0 && git push origin v2.3.0
#
# Also runnable by hand from the Actions tab, which builds the zip and uploads
# it as a workflow artifact without creating a Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from bl_info
        id: version
        run: |
          VERSION=$(python -c "
          import re
          src = open('EasyTasks/__init__.py', encoding='utf-8').read()
          m = re.search(r'\"version\":\s*\((\d+),\s*(\d+),\s*(\d+)\)', src)
          print('.'.join(m.groups()))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version $VERSION"

      - name: Check the tag matches bl_info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v$TAG does not match bl_info version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('EasyTasks/__init__.py', encoding='utf-8').read())"

      - name: Build zip
        run: |
          mkdir -p dist
          zip -r "dist/easy_tasks_${{ steps.version.outputs.version }}.zip" EasyTasks \
            -x '*__pycache__*' '*.pyc'
          unzip -l "dist/easy_tasks_${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: easy_tasks_${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
